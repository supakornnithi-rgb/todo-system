<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>todo-system</title>
  <meta name="theme-color" content="#5b8a72">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="loading-bar" id="loading-bar"></div>

  <!-- UX2: topbar เดียว sticky คุมทั้ง row1 (workspace/Someday/Dream/menu) และ row2 (capture form) -->
  <div class="topbar" id="topbar">
    <div class="topbar-row1">
      <div class="tabs" id="workspace-tabs">
        <button class="tab-btn active" data-workspace="Personal">Personal</button>
        <button class="tab-btn" data-workspace="Office">Office</button>
      </div>
      <div class="topbar-spacer"></div>
      <button class="someday-btn" id="someday-btn" type="button" aria-label="Someday">
        🗂 <span class="btn-label">Someday</span> <span id="someday-count">0</span>
      </button>
      <button class="dreams-btn" id="dreams-btn" type="button">🌟 <span class="btn-label">Dream</span></button>
      <div class="menu-wrap">
        <button class="menu-btn" id="menu-btn" type="button" aria-label="เมนู">≡</button>
        <div class="menu-dropdown" id="menu-dropdown" hidden>
          <button type="button" id="menu-workload">ภาพรวมงานค้าง</button>
          <button type="button" id="menu-history">ประวัติงานเสร็จ</button>
          <button type="button" id="menu-logout">ออกจากระบบ</button>
        </div>
      </div>
    </div>

    <p class="status-line" id="status-line" hidden></p>

    <form class="capture-form" id="capture-form">
      <input type="text" id="capture-input" placeholder="พิมพ์งานแล้วกด Enter… (ใช้ #project ได้)" autocomplete="off">
      <button type="submit" class="capture-submit-btn" aria-label="เพิ่มงาน">+</button>
      <!-- UX1: ตัวคั่นแถวสำหรับ layout 2 แถวบนจอแคบ (<560px) — ไม่มีผลที่ ≥560px (ดู style.css) -->
      <span class="row-break" aria-hidden="true"></span>
      <select id="capture-day" class="capture-day-select" aria-label="เลือกวัน"></select>
      <select id="capture-project" class="capture-project-select" aria-label="เลือก project"></select>
    </form>
  </div>

  <!-- UX2: project filter chips อยู่ใต้ topbar เลย ไม่ sticky (ต่างจาก topbar ด้านบน) -->
  <div class="project-filter" id="project-filter" hidden></div>

  <main>
    <div id="board"></div>
  </main>

  <div class="toast" id="toast"></div>
  <div class="queue-status" id="queue-status" hidden></div>

  <!-- L2P4: overlay login เต็มจอ — บล็อกไม่ให้เห็น/ใช้แอปจนกว่าจะมี session (ดู app.js ท้ายไฟล์) -->
  <div class="login-overlay" id="login-overlay" hidden>
    <form class="login-card" id="login-form">
      <p class="login-title">todo-system</p>
      <input type="email" id="login-email" placeholder="อีเมล" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
      <p class="login-error" id="login-error"></p>
      <button type="submit" id="login-submit">เข้าสู่ระบบ</button>
    </form>
  </div>

  <!-- L2P4: badge บอกว่านี่คือเวอร์ชันทดสอบ (Supabase) — โชว์เฉพาะตอนรันใต้ /next/ ดู config.js -->
  <div class="test-badge" id="test-badge" hidden>เวอร์ชันทดสอบ (Supabase)</div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabase-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
